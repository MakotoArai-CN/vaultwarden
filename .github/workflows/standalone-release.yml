name: Standalone Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: sqlite,vendored_openssl
            bin: vaultwarden.exe
            musl: "false"
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: sqlite,vendored_openssl,enable_mimalloc
            bin: vaultwarden
            musl: "true"
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            features: sqlite,vendored_openssl,enable_mimalloc
            bin: vaultwarden
            musl: "true"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: sqlite,vendored_openssl
            bin: vaultwarden
            musl: "false"
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            features: sqlite,vendored_openssl
            bin: vaultwarden
            musl: "false"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: NASM (vendored OpenSSL)
        uses: ilammy/setup-nasm@v1

      - name: Setup Perl (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install strawberryperl -y --no-progress
          # 设置环境变量
          echo "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          perl --version

      - name: Zig (musl)
        if: matrix.musl == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: cargo-zigbuild
        if: matrix.musl == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (musl)
        if: matrix.musl == 'true'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Build (native)
        if: matrix.musl != 'true'
        run: cargo build --release --locked --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Download web-vault
        run: |
          set -euo pipefail
          VER=$(python -c "import re,pathlib; t=pathlib.Path('docker/DockerSettings.yaml').read_text(encoding='utf-8'); print(re.search(r'vault_version:\s*\"([^\"]+)\"', t).group(1))")
          echo "Web Vault version: $VER"
          curl -fsSL -o bw_web.tgz "https://github.com/dani-garcia/bw_web_builds/releases/download/${VER}/bw_web_${VER}.tar.gz"
          tar -xzf bw_web.tgz
          test -f web-vault/index.html

      - name: Package
        run: |
          set -euo pipefail
          STAGE="pkg/${{ matrix.name }}"
          mkdir -p "$STAGE/data"
          cp -a web-vault "$STAGE/"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
          cp deploy/standalone/.env.example "$STAGE/.env"
          cp deploy/standalone/README.txt "$STAGE/"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then
            cp deploy/standalone/start.ps1 deploy/standalone/start.bat "$STAGE/"
          else
            cp deploy/standalone/start.sh "$STAGE/"
            chmod +x "$STAGE/start.sh" "$STAGE/${{ matrix.bin }}"
          fi
          python -c "import shutil; shutil.make_archive('vaultwarden-${{ matrix.name }}', 'zip', 'pkg/${{ matrix.name }}')"
          ls -lh vaultwarden-${{ matrix.name }}.zip

      - name: Generate checksums
        run: |
          sha256sum vaultwarden-${{ matrix.name }}.zip > vaultwarden-${{ matrix.name }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-${{ matrix.name }}
          path: |
            vaultwarden-${{ matrix.name }}.zip
            vaultwarden-${{ matrix.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(artifacts/*.zip artifacts/*.sha256)
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No artifacts found" >&2
            exit 1
          fi
          
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "$TAG" \
              --title "Vaultwarden $TAG" \
              "${FILES[@]}"
          else
            if gh release view nightly >/dev/null 2>&1; then
              gh release delete nightly --yes
            fi
            git tag -f nightly
            git push -f origin nightly
            gh release create nightly --prerelease --title "Nightly Build" "${FILES[@]}"
          fi
